<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Falcor streaming</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/input.js" defer></script>
  <script src="/client.js" defer></script>
</head>
<body>
  <div id="viewer">
    <aside id="sidebar" class="collapsed" aria-label="Stream controls">
      <nav aria-label="Viewer controls">
        <button id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Expand sidebar" title="Expand sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m7-12-4 4 4 4"/></svg>
          <span id="sidebar-toggle-label" class="control-label">Expand sidebar</span>
        </button>
        <button id="fullscreen" aria-label="Full screen" title="Full screen (Esc to exit)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
          <span class="control-label">Full screen</span>
        </button>
        <button id="connection" aria-label="Connect" title="Connect">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m-5-7a9 9 0 1 0 10 0"/></svg>
          <span id="connection-label" class="control-label">Connect</span>
        </button>
        <label class="fit-control" title="Fit to view">
          <input id="fit-view" type="checkbox" checked aria-label="Fit to view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m9 9-3 3 3 3m6-6 3 3-3 3"/></svg>
          <span class="control-label">Fit to view</span>
        </label>
      </nav>
      <details id="statistics">
        <summary>Statistics</summary>
        <pre id="statistics-values"></pre>
      </details>
      <footer>OpenH264 Video Codec provided by Cisco Systems, Inc.</footer>
    </aside>
    <main>
      <p id="message" role="alert"></p>
      <div id="viewport" class="viewport">
        <video id="video" autoplay muted playsinline tabindex="0" aria-label="Rendered viewport"></video>
        <textarea id="text-input" tabindex="-1" aria-label="Remote keyboard input" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      </div>
    </main>
  </div>
</body>
</html>
